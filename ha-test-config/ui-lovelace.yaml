title: Three State Switch Test
views:
  - title: Main
    path: default_view
    badges: []
    cards:
      - type: entities
        title: Test controls
        entities:
          - entity: input_boolean.heating_external_force
            name: External force ON
          - entity: input_boolean.heating_auto
            name: Auto mode
