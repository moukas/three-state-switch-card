name: Bug report
description: Report a problem with the card
title: "[Bug]: "
labels: ["bug"]
body:
  - type: input
    id: version
    attributes:
      label: Card version
      placeholder: 0.1.0
    validations:
      required: true
  - type: input
    id: ha
    attributes:
      label: Home Assistant version
    validations:
      required: true
  - type: textarea
    id: config
    attributes:
      label: YAML configuration
      render: yaml
    validations:
      required: true
  - type: textarea
    id: description
    attributes:
      label: Problem description
    validations:
      required: true
  - type: textarea
    id: console
    attributes:
      label: Browser console errors
      render: text
