name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: "22"
      - run: npm test
      - uses: softprops/action-gh-release@v3
        with:
          files: dist/three-state-switch-card.js
          generate_release_notes: true
