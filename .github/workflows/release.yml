name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm test
      - name: Package release
        run: |
          mkdir release
          cp dist/three-state-switch-card.js release/
          cd release
          zip three-state-switch-card.zip three-state-switch-card.js
      - uses: softprops/action-gh-release@v2
        with:
          files: release/three-state-switch-card.zip
          generate_release_notes: true
