<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-labelledby="title desc">
  <title id="title">Three State Switch Card Icon</title>
  <desc id="desc">Rounded Home Assistant style three-position switch with on, auto, and off markers.</desc>
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f5f7fb"/>
      <stop offset="100%" stop-color="#d9e4f2"/>
    </linearGradient>
    <linearGradient id="track" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#10263f"/>
      <stop offset="100%" stop-color="#19395c"/>
    </linearGradient>
    <linearGradient id="thumb" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#56d37b"/>
      <stop offset="100%" stop-color="#1ba466"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="18" stdDeviation="18" flood-color="#0a1624" flood-opacity="0.22"/>
    </filter>
  </defs>
  <rect width="512" height="512" rx="120" fill="url(#bg)"/>
  <g filter="url(#shadow)">
    <rect x="156" y="56" width="200" height="400" rx="96" fill="url(#track)"/>
    <rect x="176" y="76" width="160" height="360" rx="80" fill="#21476d"/>
    <rect x="184" y="80" width="144" height="112" rx="72" fill="url(#thumb)"/>
    <circle cx="256" cy="136" r="26" fill="#ffffff" fill-opacity="0.95"/>
  </g>
  <g fill="#d9e4f2" fill-opacity="0.92">
    <circle cx="256" cy="256" r="10"/>
    <circle cx="256" cy="328" r="10"/>
    <path d="M104 138h26v-26h20v26h26v20h-26v26h-20v-26h-26z"/>
    <path d="M108 248h64v20h-64z"/>
    <path d="M100 318h72v20h-72z"/>
    <path d="M126 292h20v72h-20z"/>
    <path d="M362 138h52v20h-52z"/>
    <path d="M362 248h52v20h-52z"/>
    <path d="M362 318h52v20h-52z"/>
  </g>
  <g fill="#32547b" fill-opacity="0.9" font-family="Segoe UI, Arial, sans-serif" font-size="26" font-weight="700" text-anchor="middle">
    <text x="138" y="224">ON</text>
    <text x="393" y="224">AUTO</text>
    <text x="138" y="392">OFF</text>
