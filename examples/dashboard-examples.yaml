# Automatic options from the entity
type: custom:three-state-switch-card
entity: input_select.heating_mode

# In Auto, show the real device state in the subtitle (Auto · Zapnuto/Vypnuto)
actual_state_entity: binary_sensor.heating_active
actual_state_on_label: Zapnuto
actual_state_off_label: Vypnuto
auto_active_color: "#fbc02d"

# Full vertical configuration
type: custom:three-state-switch-card
entity: input_select.heating_mode
name: Heating
subtitle: Operating mode
orientation: vertical
interaction: tap-drag
options:
  - value: "On"
    label: "On"
    icon: mdi:power
    color: var(--success-color)
  - value: "Auto"
    label: "Auto"
    icon: mdi:autorenew
    color: var(--primary-color)
  - value: "Off"
    label: "Off"
    icon: mdi:power-off
    color: var(--disabled-text-color)

# Compact horizontal variant
type: custom:three-state-switch-card
entity: select.heat_pump_mode
orientation: horizontal
compact: true
show_subtitle: false
show_labels: true

# Home Assistant recorder-style history timeline
type: custom:three-state-switch-card
state_entity: binary_sensor.heating_active
auto_entity: input_boolean.heating_auto
manual_entity: input_boolean.heating_manual
orientation: horizontal
show_history: true
history_hours: 24
history_limit: 5

# Minimal switch row; click the icon or name for the animated vertical switch dialog
type: custom:three-state-switch-card
entity: input_select.heating_mode
variant: minimal
